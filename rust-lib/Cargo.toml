[package]
name = "keystore_module"
version = "1.0.0"
edition = "2021"
description = "Logos keystore module — scrypt vaults, BIP39/BIP32 HD derivation, secp256k1 signing. No network."
# Pin to the nix toolchain's rustc so the MSRV-aware resolver (below) selects
# dependency versions that compile under the builder (rustc 1.89), not just the
# newest that need a fresher compiler.
rust-version = "1.89"

# Standalone crate — the empty table keeps cargo from adopting the workspace's
# many sibling crates. resolver "3" makes lockfile selection MSRV-aware.
[workspace]
resolver = "3"

[lib]
# staticlib: linked into the Qt plugin by the builder. rlib: lets `cargo test`
# build the core crypto in isolation (the Logos glue is feature-gated, off by
# default for cargo, on for the builder — see lib.rs).
crate-type = ["staticlib", "rlib"]

[dependencies]
# Offline Ethereum crypto. Narrow alloy features — no provider/rpc/network I/O.
alloy = { version = "1", default-features = false, features = [
    "std", "consensus", "eips", "rlp", "signers", "signer-local", "signer-mnemonic", "k256",
    "dyn-abi", "eip712",
] }
eth-keystore = "0.5"
# coins-bip39 (BIP39) is used via alloy's re-export (alloy::signers::local::
# coins_bip39) so there is exactly one version in the graph. coins-bip32 has to be
# direct: alloy-signer-local re-exports only coins_bip39, and HD derivation needs the
# extended-key type itself. It unifies with the copy coins-bip39 already pulls in.
coins-bip32 = "0.12"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
hex = "0.4"
# Wipes decrypted secrets on drop. Already in the lock graph transitively; this
# only promotes it to a direct dependency.
zeroize = "1"
# SHA-256 for the approval commitment. Deliberately NOT keccak256: a bundle id
# must never be mistakable for a signable Ethereum digest.
sha2 = "0.10"
# Atomic writes. Promoted from dev-dependencies: it was already in the lock graph, so this
# adds zero nodes, and its NamedTempFile creates at 0600 rather than at the umask.
tempfile = "3"
# Bitcoin keys, PSBTs and BIP340 signing. Brings libsecp256k1 (C) beside alloy's k256; the
# plugin's export list keeps its symbols in (see CMakeLists.txt).
bitcoin = { version = "0.32.102", default-features = false, features = ["std", "base64", "rand-std"] }

# Identity keys: Ed25519 (RFC 8032) and SLIP-0010's HMAC-SHA512. hmac is already in the lock
# graph; ed25519-dalek is new, pure Rust.
ed25519-dalek = { version = "2", features = ["zeroize"] }
hmac = "0.12"
# Identity keys open libsodium sealed boxes (crypto_box_seal) addressed to their X25519 key.
crypto_box = { version = "0.9", features = ["seal", "std"] }

# logos.signer/1: its payload types, signature checks and job bookkeeping. The ed25519 family is
# on corpetty/logos-signer-interface feat/ed25519-family (03eece5 + one commit), proposed upstream.
logos-signer-interface = { git = "https://github.com/corpetty/logos-signer-interface", rev = "3ebac518b4a62bab534be01e669790bfc73a488e" }

# The Logos runtime SDK is staged by the builder as a sibling crate. It is
# optional + enabled by the default `logos_module` feature so `cargo test
# --no-default-features` can build the crypto core without it (and without the
# generated scaffold / unresolved lp_* link symbols).
logos-rust-sdk = { path = "../logos-rust-sdk-src", optional = true }

[target.'cfg(unix)'.dependencies]
# mlock for unlocked keys, and keeping them out of core dumps on Linux.
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Memory"] }

[dev-dependencies]
logos-signer-interface = { git = "https://github.com/corpetty/logos-signer-interface", rev = "3ebac518b4a62bab534be01e669790bfc73a488e", features = ["conformance", "mock"] }

[features]
default = ["logos_module"]
logos_module = ["dep:logos-rust-sdk"]

